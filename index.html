<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { display: none; }
        .tab-btn.active { color: #2563eb; font-weight: bold; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans antialiased h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center z-10">
        <h1 class="text-xl font-bold">Fitness Tracker</h1>
        <button onclick="fetchData()" class="bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded text-sm shadow">
            <i class="fas fa-sync-alt mr-1"></i> Sync
        </button>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-4 pb-24 relative" id="main-container">
        
        <!-- Loading Overlay -->
        <div id="loading" class="absolute inset-0 bg-gray-100 bg-opacity-75 flex items-center justify-center z-50 hidden">
            <div class="text-xl text-blue-600"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
        </div>

        <!-- TAB: DASHBOARD (Calendar/Tracker) -->
        <div id="tab-dashboard" class="tab-content hidden">
            <div class="bg-white rounded-lg shadow p-4 mb-4">
                <h2 class="text-lg font-bold border-b pb-2 mb-3">Daily Progress</h2>
                <div id="dashboard-list" class="space-y-4">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>

        <!-- TAB: LOG (Active Workout Session) -->
        <div id="tab-log" class="tab-content tab-active">
            <!-- Workout Header & Schedule Selector -->
            <div class="bg-white rounded-lg shadow p-4 mb-4">
                <div class="flex justify-between items-center border-b border-gray-100 pb-3 mb-3">
                    <div>
                        <h2 class="text-lg font-bold text-gray-900"><i class="fas fa-running text-blue-600 mr-2"></i>Active Workout</h2>
                        <p class="text-xs text-gray-500">Select a routine & log sets per exercise</p>
                    </div>
                    <div>
                        <input type="date" id="log-date" onchange="renderActiveWorkout()" class="bg-gray-50 border border-gray-300 text-gray-800 rounded px-2 py-1 text-xs font-semibold focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Workout Schedule / Routine</label>
                    <select id="routine-select" onchange="onRoutineChange(this.value)" class="w-full bg-blue-50 border border-blue-300 text-blue-900 rounded font-semibold p-2 focus:ring-blue-500 focus:border-blue-500 text-sm">
                        <option value="">-- Free Workout (Custom) --</option>
                    </select>
                </div>
            </div>

            <!-- Active Workout Exercises Container -->
            <div id="active-workout-exercises" class="space-y-4 mb-4">
                <!-- Dynamically rendered Exercise Cards -->
            </div>

            <!-- Add Exercise to Workout Selector -->
            <div class="bg-white rounded-lg shadow p-4 mb-6 border border-dashed border-gray-300">
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Add Another Exercise to this Workout</label>
                <div class="flex space-x-2">
                    <select id="add-exercise-select" class="flex-1 bg-gray-50 border border-gray-300 text-gray-900 rounded p-2 text-sm">
                        <option value="">-- Choose Exercise --</option>
                    </select>
                    <button onclick="addExerciseToActiveWorkout()" class="bg-gray-800 text-white px-4 py-2 rounded text-sm font-bold hover:bg-gray-900">
                        + Add
                    </button>
                </div>
            </div>

            <!-- Finish Workout Card -->
            <div id="finish-workout-card" class="bg-green-600 text-white rounded-lg shadow p-4 text-center cursor-pointer hover:bg-green-700 transition font-bold text-base mb-6" onclick="finishWorkout()">
                <i class="fas fa-check-circle mr-2"></i> Finish Workout Session
            </div>
        </div>

        <!-- TAB: EXERCISES -->
        <div id="tab-exercises" class="tab-content hidden">
            <div class="bg-white rounded-lg shadow p-4 mb-4 text-sm">
                <h2 class="text-lg font-bold border-b pb-2 mb-4">Add New Exercise</h2>
                <div class="mb-3">
                    <label class="block text-xs text-gray-600">Name</label>
                    <input type="text" id="new-ex-name" class="w-full border p-2 rounded" placeholder="e.g. Incline Dumbbell Press">
                </div>
                <div class="mb-4">
                    <label class="block text-xs text-gray-600 uppercase mb-1">Category</label>
                    <select id="new-ex-cat" class="w-full border p-2 rounded">
                        <option>Chest</option><option>Back</option><option>Legs</option>
                        <option>Shoulders</option><option>Arms</option><option>Core</option><option>Cardio</option>
                    </select>
                </div>
                <button onclick="addExercise()" class="w-full bg-green-600 text-white font-bold py-2 rounded shadow hover:bg-green-700">Add Exercise</button>
            </div>
            
            <h3 class="font-bold text-gray-700 mb-2">My Exercise Library</h3>
            <div id="exercise-list" class="space-y-2">
                <!-- rendering exercises here -->
            </div>
        </div>

        <!-- TAB: PLANS -->
        <div id="tab-plans" class="tab-content hidden">
             <div class="bg-white rounded-lg shadow p-4 mb-4 text-sm">
                <h2 class="text-lg font-bold border-b pb-2 mb-4">Create Workout Schedule</h2>
                <div class="mb-3">
                    <label class="block text-xs text-gray-600">Plan Name</label>
                    <input type="text" id="new-plan-name" class="w-full border p-2 rounded" placeholder="e.g. Pull Day A">
                </div>
                <div class="mb-3">
                    <label class="block text-xs text-gray-600">Included Exercises (Hold Ctrl/Cmd to select multiple)</label>
                    <select id="new-plan-exercises" multiple class="w-full border p-2 rounded h-32">
                        <!-- Populated by JS -->
                    </select>
                </div>
                <button onclick="addPlan()" class="w-full bg-purple-600 text-white font-bold py-2 rounded shadow hover:bg-purple-700">Save Schedule</button>
            </div>

            <h3 class="font-bold text-gray-700 mb-2">My Schedules</h3>
            <div id="plans-list" class="space-y-3">
                <!-- rendering plans -->
            </div>
        </div>

    </main>

    <!-- Bottom Navigation -->
    <nav class="bg-white border-t fixed bottom-0 w-full flex justify-around p-2 pb-4 shadow-[0_-2px_10px_rgba(0,0,0,0.05)] z-20">
        <button onclick="switchTab('dashboard')" id="nav-dashboard" class="tab-btn flex-1 flex flex-col items-center text-gray-400 hover:text-blue-600 transition-colors duration-200">
            <i class="fas fa-chart-line text-xl mb-1"></i>
            <span class="text-xs">Dashboard</span>
        </button>
        <button onclick="switchTab('log')" id="nav-log" class="tab-btn active flex-1 flex flex-col items-center text-gray-400 hover:text-blue-600 transition-colors duration-200">
            <i class="fas fa-dumbbell text-xl mb-1"></i>
            <span class="text-xs">Log</span>
        </button>
        <button onclick="switchTab('exercises')" id="nav-exercises" class="tab-btn flex-1 flex flex-col items-center text-gray-400 hover:text-blue-600 transition-colors duration-200">
            <i class="fas fa-list text-xl mb-1"></i>
            <span class="text-xs">Exercises</span>
        </button>
        <button onclick="switchTab('plans')" id="nav-plans" class="tab-btn flex-1 flex flex-col items-center text-gray-400 hover:text-blue-600 transition-colors duration-200">
            <i class="fas fa-clipboard-list text-xl mb-1"></i>
            <span class="text-xs">Schedules</span>
        </button>
    </nav>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyZbnG3jv37Af1pKFOZIEAamQRHFzIKSQN4IvwdxsWCjWb_NCJV0NGSpOThNN7sqOGwnQ/exec";
        
        let appData = {
            exercises: [],
            logs: [],
            templates: []
        };

        let activeWorkout = {
            exercises: []
        };

        // UI Helpers
        function showLoading() { document.getElementById('loading').classList.remove('hidden'); }
        function hideLoading() { document.getElementById('loading').classList.add('hidden'); }
        
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('active', 'text-blue-600');
                el.classList.add('text-gray-400');
            });
            const navBtn = document.getElementById('nav-' + tabId);
            navBtn.classList.add('active', 'text-blue-600');
            navBtn.classList.remove('text-gray-400');
        }

        async function apiCall(method, payload = null, typeParam = "") {
            try {
                let url = method === 'GET' ? `${API_URL}?type=${typeParam}` : API_URL;
                let options = { 
                    method: method,
                    redirect: "follow"
                };
                if (payload) {
                    options.headers = { "Content-Type": "text/plain;charset=utf-8" };
                    options.body = JSON.stringify(payload);
                }
                const response = await fetch(url, options);
                return await response.json();
            } catch (err) {
                console.error(err);
                if (method === 'GET') {
                    // Ignore errors silently on boot, but show on POST
                    return { success: false };
                }
                alert("Network error: " + err.message);
                return { success: false };
            }
        }

        async function fetchData() {
            showLoading();
            // Parallel fetches to speed up sync!
            const [exRes, logRes, tplRes] = await Promise.all([
                apiCall('GET', null, 'Exercises'),
                apiCall('GET', null, 'Logs'),
                apiCall('GET', null, 'Templates')
            ]);
            
            hideLoading();

            if (exRes.success && Array.isArray(exRes.data)) appData.exercises = exRes.data;
            if (logRes.success && Array.isArray(logRes.data)) appData.logs = logRes.data;
            if (tplRes.success && Array.isArray(tplRes.data)) appData.templates = tplRes.data;
            
            renderAll();
        }

        function renderAll() {
            initDateInput();

            // Populate Exercise Dropdowns across tabs
            const selectOptions = appData.exercises.map(ex => `<option value="${ex.Name}">${ex.Name}</option>`).join('');
            if (document.getElementById('add-exercise-select')) {
                document.getElementById('add-exercise-select').innerHTML = '<option value="">-- Choose Exercise --</option>' + selectOptions;
            }
            if (document.getElementById('new-plan-exercises')) {
                document.getElementById('new-plan-exercises').innerHTML = selectOptions;
            }
            if (document.getElementById('routine-select')) {
                const currentRoutine = document.getElementById('routine-select').value;
                const routineOptions = appData.templates.map(t => `<option value="${t.Template_Name}">${t.Template_Name}</option>`).join('');
                document.getElementById('routine-select').innerHTML = '<option value="">-- Free Workout (Custom) --</option>' + routineOptions;
                if (currentRoutine) document.getElementById('routine-select').value = currentRoutine;
            }

            renderDashboard();
            renderActiveWorkout();
            renderExerciseLibrary();
            renderPlansList();
        }

        function renderDashboard() {
            const logsByDate = {};
            appData.logs.forEach(log => {
                if (!log.Date || !log.Exercise_ID) return;
                const d = log.Date;
                if(!logsByDate[d]) logsByDate[d] = { sets: 0, volume: 0, exercises: new Set() };
                logsByDate[d].sets += 1;
                logsByDate[d].volume += (Number(log.Weight)||0) * (Number(log.Reps)||0);
                logsByDate[d].exercises.add(log.Exercise_ID);
            });
            const sortedDates = Object.keys(logsByDate).sort((a,b) => b.localeCompare(a));
            const dashHtml = sortedDates.map(date => `
                <div class="border border-gray-200 rounded-lg p-4 bg-white shadow-sm">
                    <div class="flex justify-between items-center border-b border-gray-100 pb-2 mb-3">
                        <span class="font-bold text-gray-800 text-lg"><i class="far fa-calendar-check text-blue-500 mr-2"></i>${date}</span>
                        <span class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded font-bold uppercase tracking-wide">${logsByDate[date].sets} Sets</span>
                    </div>
                    <div class="text-sm text-gray-600 mb-3">
                        <p class="font-medium">Total Volume: <span class="font-bold text-gray-900">${logsByDate[date].volume.toLocaleString()} lbs</span></p>
                    </div>
                    <div class="bg-gray-50 rounded p-2 border border-gray-100">
                        <p class="text-xs text-gray-500 font-semibold uppercase mb-1">Trained Exercises</p>
                        <p class="text-sm text-gray-800 font-medium">${Array.from(logsByDate[date].exercises).join(' • ')}</p>
                    </div>
                </div>
            `).join('');
            if (document.getElementById('dashboard-list')) {
                document.getElementById('dashboard-list').innerHTML = dashHtml || "<p class='text-sm text-gray-500 italic'>No workout days logged yet. Go log a set!</p>";
            }
        }

        function renderExerciseLibrary() {
            const exListHtml = appData.exercises.map(ex => `
                <div class="p-3 bg-white border border-gray-100 rounded shadow-sm flex justify-between items-center transition hover:bg-gray-50">
                    <span class="font-semibold text-gray-800">${ex.Name}</span>
                    <span class="text-[10px] uppercase font-bold tracking-wider bg-gray-200 text-gray-700 px-2 py-1 rounded-full">${ex.Category || 'Generic'}</span>
                </div>
            `).join('');
            if (document.getElementById('exercise-list')) {
                document.getElementById('exercise-list').innerHTML = exListHtml || '<p class="text-sm text-gray-500 italic">No exercises added to database yet.</p>';
            }
        }

        function renderPlansList() {
            const plansHtml = appData.templates.map(tpl => `
                <div class="p-4 bg-white border border-gray-200 rounded-lg shadow-sm">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-gray-900 text-base">${tpl.Template_Name}</span>
                        <button onclick="startWorkout(this.dataset.planName)" data-plan-name="${tpl.Template_Name.replace(/"/g, '&quot;')}" class="bg-blue-100 text-blue-700 font-semibold px-3 py-1 rounded text-xs hover:bg-blue-200 transition">Start</button>
                    </div>
                    <p class="text-xs text-gray-500 leading-relaxed">${tpl.Exercise_Sequence}</p>
                </div>
            `).join('');
            if (document.getElementById('plans-list')) {
                document.getElementById('plans-list').innerHTML = plansHtml || '<p class="text-sm text-gray-500 italic">No schedules created yet.</p>';
            }
        }

        function renderActiveWorkout() {
            const container = document.getElementById('active-workout-exercises');
            if (!container) return;
            
            const dateInput = document.getElementById('log-date');
            const dateVal = dateInput ? (dateInput.value || getLocalDateString()) : getLocalDateString();

            // Include any exercise that already has logged sets on this Date
            appData.logs.filter(l => l.Date === dateVal && l.Exercise_ID).forEach(l => {
                if (!activeWorkout.exercises.includes(l.Exercise_ID)) {
                    activeWorkout.exercises.push(l.Exercise_ID);
                }
            });

            if (activeWorkout.exercises.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-lg shadow p-8 text-center border border-dashed border-gray-300">
                        <i class="fas fa-dumbbell text-gray-400 text-4xl mb-2"></i>
                        <p class="text-gray-600 font-semibold mb-1">No exercises in today's workout yet</p>
                        <p class="text-xs text-gray-400">Select a Routine above or pick an exercise below to start logging!</p>
                    </div>
                `;
                return;
            }

            const cardsHtml = activeWorkout.exercises.map((exName, exIndex) => {
                const setsToday = appData.logs.filter(l => l.Date === dateVal && l.Exercise_ID === exName);
                
                // Pre-fill weight with last logged set weight for this exercise
                const allSetsForEx = appData.logs.filter(l => l.Exercise_ID === exName);
                const lastWeight = allSetsForEx.length > 0 ? allSetsForEx[allSetsForEx.length - 1].Weight : "";

                let tableHtml = `<p class="text-xs text-gray-400 italic py-2">No sets logged for this exercise today.</p>`;
                
                if (setsToday.length > 0) {
                    const rowsHtml = setsToday.map((s, idx) => `
                        <tr class="border-b border-gray-100 last:border-b-0 text-sm">
                            <td class="py-1.5 font-bold text-gray-500">${idx + 1}</td>
                            <td class="py-1.5 font-bold text-blue-600">${s.Weight} <span class="text-xs font-normal text-gray-400">lbs</span></td>
                            <td class="py-1.5 font-semibold text-gray-800">${s.Reps} <span class="text-xs font-normal text-gray-400">reps</span></td>
                        </tr>
                    `).join('');
                    
                    tableHtml = `
                        <table class="w-full text-left mt-2 mb-3">
                            <thead>
                                <tr class="border-b border-gray-200 text-[10px] font-bold text-gray-400 uppercase">
                                    <th class="py-1">Set</th>
                                    <th class="py-1">Weight</th>
                                    <th class="py-1">Reps</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rowsHtml}
                            </tbody>
                        </table>
                    `;
                }

                return `
                    <div class="bg-white rounded-lg shadow border border-gray-200 p-4">
                        <div class="flex justify-between items-center border-b border-gray-100 pb-2 mb-2">
                            <div>
                                <span class="font-bold text-gray-900 text-base">${exName}</span>
                            </div>
                            <button onclick="removeExerciseFromActiveWorkout('${exName}')" class="text-gray-400 hover:text-red-500 text-xs">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        
                        ${tableHtml}
                        
                        <!-- Inline Add Set Bar -->
                        <div class="flex space-x-2 pt-2 border-t border-gray-100 items-center">
                            <div class="w-1/3">
                                <input type="number" id="weight-${exIndex}" value="${lastWeight}" class="w-full bg-gray-50 border border-gray-300 rounded p-1.5 text-xs font-semibold" placeholder="Weight">
                            </div>
                            <div class="w-1/3">
                                <input type="number" id="reps-${exIndex}" class="w-full bg-gray-50 border border-gray-300 rounded p-1.5 text-xs font-semibold" placeholder="Reps">
                            </div>
                            <div class="w-1/3">
                                <button onclick="logSetForExercise('${exName}', ${exIndex})" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-1.5 rounded text-xs shadow flex items-center justify-center">
                                    <i class="fas fa-plus mr-1"></i> Log Set
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = cardsHtml;
        }

        async function logSetForExercise(exName, exIndex) {
            const weightEl = document.getElementById(`weight-${exIndex}`);
            const repsEl = document.getElementById(`reps-${exIndex}`);
            const weight = weightEl ? weightEl.value : "";
            const reps = repsEl ? repsEl.value : "";
            const dateVal = document.getElementById("log-date").value || getLocalDateString();

            if (weight === '' || reps === '') {
                return alert("Please enter Weight and Reps for " + exName);
            }

            const payload = {
                type: "Logs", 
                data: {
                    Log_ID: Date.now(),
                    Date: dateVal,
                    Workout_ID: "W-Manual",
                    Exercise_ID: exName,
                    Weight: weight,
                    Reps: reps
                }
            };

            const res = await apiCall('POST', payload);
            if (!res.success) {
                alert("Failed to save set: " + (res.error || "Server error"));
                return;
            }

            appData.logs.push(payload.data);
            if (repsEl) repsEl.value = ""; // Clear reps
            renderActiveWorkout();
            renderDashboard();
        }

        function onRoutineChange(templateName) {
            if (!templateName) return;
            const tpl = appData.templates.find(t => t.Template_Name === templateName);
            if (tpl && tpl.Exercise_Sequence) {
                const exercisesList = tpl.Exercise_Sequence.split(',').map(s => s.trim()).filter(Boolean);
                exercisesList.forEach(ex => {
                    if (!activeWorkout.exercises.includes(ex)) {
                        activeWorkout.exercises.push(ex);
                    }
                });
                renderActiveWorkout();
            }
        }

        function addExerciseToActiveWorkout() {
            const sel = document.getElementById('add-exercise-select');
            const exName = sel ? sel.value : "";
            if (!exName) return alert("Please choose an exercise to add.");
            if (!activeWorkout.exercises.includes(exName)) {
                activeWorkout.exercises.push(exName);
                renderActiveWorkout();
            }
            sel.value = "";
        }

        function removeExerciseFromActiveWorkout(exName) {
            activeWorkout.exercises = activeWorkout.exercises.filter(e => e !== exName);
            renderActiveWorkout();
        }

        function finishWorkout() {
            const dateVal = document.getElementById("log-date").value || getLocalDateString();
            const setsToday = appData.logs.filter(l => l.Date === dateVal);
            if (setsToday.length === 0) {
                return alert("No sets logged for today's workout yet!");
            }
            alert(`Workout Session Saved!\n\nYou logged ${setsToday.length} total sets on ${dateVal}.\nCheck your Daily Progress in the Dashboard!`);
            switchTab('dashboard');
        }

        function startWorkout(planName) {
            document.getElementById('routine-select').value = planName;
            onRoutineChange(planName);
            switchTab('log');
        }

        function getLocalDateString() {
            const d = new Date();
            const pad = n => n < 10 ? '0'+n : n;
            return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
        }

        function initDateInput() {
            const dateInput = document.getElementById('log-date');
            if (dateInput && !dateInput.value) {
                dateInput.value = getLocalDateString();
            }
        }

        async function addExercise() {
            const name = document.getElementById("new-ex-name").value;
            const cat = document.getElementById("new-ex-cat").value;
            if(!name) return alert("Please provide an exercise name.");

            showLoading();
            const payload = {
                type: "Exercises",
                data: { ID: 'EX-'+Date.now(), Name: name, Category: cat }
            };
            const res = await apiCall('POST', payload);
            hideLoading();
            
            if (!res.success) {
                return alert("Failed to add exercise: " + (res.error || "Unknown error"));
            }
            
            appData.exercises.push(payload.data);
            document.getElementById("new-ex-name").value = "";
            renderAll();
            alert(`Added ${name} to your library!`);
        }

        async function addPlan() {
            const name = document.getElementById("new-plan-name").value;
            const selOptions = document.getElementById("new-plan-exercises").selectedOptions;
            const exercises = Array.from(selOptions).map(opt => opt.value).join(", ");
            
            if(!name || exercises.length === 0) return alert("Provide a schedule name and select at least one exercise.");

            showLoading();
            const payload = {
                type: "Templates", // This maps directly to the Google Sheet tab Name
                data: { Template_Name: name, Exercise_Sequence: exercises }
            };
            const res = await apiCall('POST', payload);
            hideLoading();
            
            if (!res.success) {
                return alert("Failed to save schedule: " + (res.error || "Unknown error"));
            }
            
            appData.templates.push(payload.data);
            document.getElementById("new-plan-name").value = "";
            renderAll();
            alert(`Workout plan '${name}' saved!`);
        }

        function startWorkout(planName) {
            const tpl = appData.templates.find(t => t.Template_Name === planName);
            if(tpl) {
                // In a V2, this could populate a specific "Active Workout Dashboard" 
                // For MVP, we switch to log screen so they know what to do next
                alert(`Starting ${planName}!\n\nYour routine today:\n${tpl.Exercise_Sequence}`);
                switchTab('log');
            }
        }

        // Init App On Load
        fetchData();
        
    </script>
</body>
</html>
