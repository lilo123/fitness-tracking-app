<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { display: none; }
        .tab-btn.active { color: #06b6d4; font-weight: 800; }
    </style>
</head>
<body class="bg-[#09090b] text-zinc-100 font-sans antialiased h-screen flex flex-col selection:bg-cyan-500 selection:text-black relative">
    <!-- Ambient glowing cyber-gym backdrop -->
    <div class="fixed inset-0 bg-[radial-gradient(ellipse_80%_80%_at_50%_-20%,rgba(6,182,212,0.12),rgba(255,255,255,0))] pointer-events-none z-0"></div>

    <!-- Header -->
    <header class="bg-zinc-900/80 backdrop-blur-xl sticky top-0 border-b border-zinc-800/80 px-4 h-14 flex justify-between items-center z-30 shadow-lg">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-zinc-950 font-black text-sm shadow-[0_0_15px_rgba(6,182,212,0.35)]">
                <i class="fas fa-dumbbell"></i>
            </div>
            <h1 class="text-lg font-black tracking-tight text-white">Workout Log</h1>
        </div>
        <div class="flex items-center gap-3">
            <span id="sync-badge" class="text-xs font-bold text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/30 flex items-center gap-1.5 shadow-[0_0_10px_rgba(16,185,129,0.15)]">
                <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span> Synced
            </span>
            <button onclick="fetchData()" class="w-10 h-10 flex items-center justify-center rounded-full text-zinc-400 hover:text-white hover:bg-zinc-800/80 active:scale-95 transition-all" aria-label="Sync Data" title="Force Sync">
                <i class="fas fa-sync-alt text-sm"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-4 pb-28 relative z-10" id="main-container">
        
        <!-- Loading Overlay -->
        <div id="loading" class="absolute inset-0 bg-zinc-950/80 backdrop-blur-sm flex items-center justify-center z-50 hidden">
            <div class="text-lg font-black text-cyan-400 flex items-center gap-2.5"><i class="fas fa-spinner fa-spin text-xl"></i> Loading...</div>
        </div>

        <!-- TAB: DASHBOARD (Calendar/Tracker) -->
        <div id="tab-dashboard" class="tab-content hidden">
            <div class="bg-zinc-900/90 border border-zinc-800/80 rounded-2xl shadow-xl p-5 mb-5">
                <h2 class="text-lg font-black border-b border-zinc-800 pb-3 mb-4 text-white flex items-center gap-2">
                    <i class="fas fa-history text-cyan-400"></i> Training History
                </h2>
                <div id="dashboard-list" class="space-y-4">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>

        <!-- TAB: LOG (Active Workout Session) -->
        <div id="tab-log" class="tab-content tab-active">
            <!-- Header Action Pill (Zero-Click Landing View) -->
            <div class="bg-gradient-to-br from-zinc-900 via-zinc-900 to-zinc-900/60 border border-zinc-800/90 rounded-2xl p-5 shadow-xl mb-5 flex justify-between items-center relative overflow-hidden">
                <div class="absolute top-0 left-0 right-0 h-0.5 bg-gradient-to-r from-cyan-500 via-blue-500 to-transparent"></div>
                <div>
                    <span class="text-[10px] font-black uppercase tracking-widest text-cyan-400 block mb-1">Today's Scheduled Routine</span>
                    <div class="flex items-center gap-2.5">
                        <h2 id="active-routine-label" class="text-xl font-black text-white tracking-tight">Free Workout</h2>
                        <button onclick="openRoutineModal()" class="text-xs bg-zinc-800/80 hover:bg-zinc-700 text-zinc-200 px-3 py-1.5 rounded-full font-bold border border-zinc-700/80 transition flex items-center gap-1.5 shadow-sm">
                            <span>Switch</span> <i class="fas fa-chevron-down text-[10px] text-cyan-400"></i>
                        </button>
                    </div>
                </div>
                <div class="flex items-center">
                    <input type="date" id="log-date" onchange="onWorkoutDateChange()" class="bg-zinc-800/80 border border-zinc-700 text-zinc-100 rounded-xl px-3 py-1.5 text-xs font-bold focus:ring-2 focus:ring-cyan-500/40 focus:border-cyan-500 outline-none">
                </div>
            </div>

            <!-- Active Workout Exercises Container -->
            <div id="active-workout-exercises" class="space-y-4 mb-5">
                <!-- Dynamically rendered Exercise Cards with Benchmark Banners -->
            </div>

            <!-- Add Exercise to Workout Selector -->
            <div class="bg-zinc-900/40 rounded-2xl shadow-lg p-5 mb-6 border border-dashed border-zinc-800">
                <label class="block text-xs font-black text-zinc-400 uppercase tracking-widest mb-2.5">Add Exercise to Workout</label>
                <div class="flex gap-2.5">
                    <select id="add-exercise-select" class="flex-1 bg-zinc-950 border border-zinc-800 text-zinc-200 rounded-xl p-3 text-sm font-bold focus:border-cyan-500 outline-none">
                        <option value="">-- Choose Exercise --</option>
                    </select>
                    <button onclick="addExerciseToActiveWorkout()" class="bg-zinc-800 hover:bg-zinc-700 text-white px-5 py-3 rounded-xl text-sm font-black hover:border-zinc-600 active:scale-95 transition-all border border-zinc-700/80">
                        + Add
                    </button>
                </div>
            </div>

            <!-- Finish Workout Card -->
            <div id="finish-workout-card" class="bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 active:scale-[0.98] text-zinc-950 rounded-2xl shadow-[0_0_25px_rgba(16,185,129,0.25)] p-4 text-center cursor-pointer transition-all font-black text-base mb-8" onclick="finishWorkout()">
                <i class="fas fa-check-circle mr-2"></i> Finish Workout Session
            </div>

            <!-- Routine Switcher Modal -->
            <div id="routine-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-4">
                <div class="bg-zinc-900 rounded-2xl shadow-2xl w-full max-w-md overflow-hidden border border-zinc-800">
                    <div class="p-4 border-b border-zinc-800 flex justify-between items-center">
                        <h3 class="font-black text-white text-base">Select Workout Routine</h3>
                        <button onclick="closeRoutineModal()" class="w-8 h-8 rounded-full bg-zinc-800 text-zinc-400 hover:text-white flex items-center justify-center font-bold">✕</button>
                    </div>
                    <div id="routine-modal-list" class="p-3.5 space-y-2.5 max-h-80 overflow-y-auto">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB: EXERCISES -->
        <div id="tab-exercises" class="tab-content hidden">
            <div class="bg-zinc-900/90 border border-zinc-800/80 rounded-2xl p-5 mb-6 shadow-xl text-sm">
                <h2 class="text-base font-black border-b border-zinc-800 pb-3 mb-4 text-white flex items-center gap-2">
                    <i class="fas fa-plus-circle text-cyan-400"></i> Add New Exercise
                </h2>
                <div class="mb-3.5">
                    <label class="block text-xs font-bold text-zinc-400 mb-1.5 uppercase tracking-wider">Exercise Name</label>
                    <input type="text" id="new-ex-name" class="w-full bg-zinc-950 border border-zinc-800 text-white rounded-xl p-3 text-sm font-semibold focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none" placeholder="e.g. Incline Dumbbell Press">
                </div>
                <div class="mb-5">
                    <label class="block text-xs font-bold text-zinc-400 mb-1.5 uppercase tracking-wider">Category</label>
                    <select id="new-ex-cat" class="w-full bg-zinc-950 border border-zinc-800 text-white rounded-xl p-3 text-sm font-semibold focus:border-cyan-500 outline-none">
                        <option>Chest</option><option>Back</option><option>Legs</option>
                        <option>Shoulders</option><option>Arms</option><option>Core</option><option>Cardio</option>
                    </select>
                </div>
                <button onclick="addExercise()" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-zinc-950 font-black py-3 rounded-xl shadow-[0_0_15px_rgba(6,182,212,0.25)] active:scale-95 transition-all">Add to Library</button>
            </div>
            
            <h3 class="font-black text-white text-base mb-3 flex items-center gap-2">
                <i class="fas fa-book-open text-cyan-400"></i> Exercise Library
            </h3>
            <div id="exercise-list" class="space-y-2.5">
                <!-- rendering exercises here -->
            </div>
        </div>

        <!-- TAB: PLANS -->
        <div id="tab-plans" class="tab-content hidden">
             <div class="bg-zinc-900/90 border border-zinc-800/80 rounded-2xl p-5 mb-6 shadow-xl text-sm">
                <h2 class="text-base font-black border-b border-zinc-800 pb-3 mb-4 text-white flex items-center gap-2">
                    <i class="fas fa-calendar-plus text-violet-400"></i> Create Workout Routine
                </h2>
                <div class="mb-3.5">
                    <label class="block text-xs font-bold text-zinc-400 mb-1.5 uppercase tracking-wider">Routine Name</label>
                    <input type="text" id="new-plan-name" class="w-full bg-zinc-950 border border-zinc-800 text-white rounded-xl p-3 text-sm font-semibold focus:border-violet-500 focus:ring-1 focus:ring-violet-500 outline-none" placeholder="e.g. Pull Day A">
                </div>
                <div class="mb-5">
                    <label class="block text-xs font-bold text-zinc-400 mb-1.5 uppercase tracking-wider">Included Exercises (Hold Ctrl/Cmd to select multiple)</label>
                    <select id="new-plan-exercises" multiple class="w-full bg-zinc-950 border border-zinc-800 text-white rounded-xl p-3 text-sm font-semibold h-36 focus:border-violet-500 outline-none">
                        <!-- Populated by JS -->
                    </select>
                </div>
                <button onclick="addPlan()" class="w-full bg-gradient-to-r from-violet-500 to-indigo-600 hover:from-violet-400 hover:to-indigo-500 text-white font-black py-3 rounded-xl shadow-[0_0_15px_rgba(139,92,246,0.25)] active:scale-95 transition-all">Save Routine</button>
            </div>

            <h3 class="font-black text-white text-base mb-3 flex items-center gap-2">
                <i class="fas fa-clipboard-list text-violet-400"></i> Saved Routines
            </h3>
            <div id="plans-list" class="space-y-3.5">
                <!-- rendering plans -->
            </div>
        </div>

    </main>

    <!-- Bottom Navigation Bar (Obsidian Frosted Glass) -->
    <nav class="bg-zinc-900/90 backdrop-blur-xl border-t border-zinc-800/80 fixed bottom-0 w-full flex justify-around px-2 py-1.5 pb-safe z-30 shadow-[0_-4px_25px_rgba(0,0,0,0.6)]">
        <button onclick="switchTab('log')" id="nav-log" class="tab-btn active flex-1 min-h-[52px] flex flex-col items-center justify-center text-cyan-400 font-extrabold transition-all">
            <i class="fas fa-dumbbell text-lg mb-0.5"></i>
            <span class="text-[11px]">Workout</span>
        </button>
        <button onclick="switchTab('dashboard')" id="nav-dashboard" class="tab-btn flex-1 min-h-[52px] flex flex-col items-center justify-center text-zinc-500 hover:text-zinc-300 transition-all">
            <i class="fas fa-chart-line text-lg mb-0.5"></i>
            <span class="text-[11px] font-medium">History</span>
        </button>
        <button onclick="switchTab('plans')" id="nav-plans" class="tab-btn flex-1 min-h-[52px] flex flex-col items-center justify-center text-zinc-500 hover:text-zinc-300 transition-all">
            <i class="fas fa-clipboard-list text-lg mb-0.5"></i>
            <span class="text-[11px] font-medium">Routines</span>
        </button>
        <button onclick="switchTab('exercises')" id="nav-exercises" class="tab-btn flex-1 min-h-[52px] flex flex-col items-center justify-center text-zinc-500 hover:text-zinc-300 transition-all">
            <i class="fas fa-list text-lg mb-0.5"></i>
            <span class="text-[11px] font-medium">Library</span>
        </button>
    </nav>    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyZbnG3jv37Af1pKFOZIEAamQRHFzIKSQN4IvwdxsWCjWb_NCJV0NGSpOThNN7sqOGwnQ/exec";
        
        let appData = {
            exercises: [],
            logs: [],
            templates: []
        };

        let activeWorkout = {
            date: "",
            routineName: "Free Workout",
            exercises: [],
            expandedExercises: new Set()
        };

        function formatShortDate(isoDateStr) {
            if (!isoDateStr || typeof isoDateStr !== 'string') return '';
            const parts = isoDateStr.split('-');
            if (parts.length !== 3) return isoDateStr;
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const mIdx = parseInt(parts[1], 10) - 1;
            const monthStr = months[mIdx] || parts[1];
            const dayStr = parseInt(parts[2], 10);
            return `${monthStr} ${dayStr}`;
        }

        const DEFAULT_EXERCISES = [
            { ID: "EX-VT1", Name: "Incline Bench Press", Category: "Chest" },
            { ID: "EX-VT2", Name: "Cable Lateral Raises", Category: "Shoulders" },
            { ID: "EX-VT3", Name: "Dips", Category: "Chest / Triceps" },
            { ID: "EX-VT4", Name: "Leg Extension Machine", Category: "Legs" },
            { ID: "EX-VT5", Name: "Overhead Tricep Cable Pull", Category: "Arms" },
            { ID: "EX-VT6", Name: "Leg Raise", Category: "Core" },
            { ID: "EX-VT7", Name: "Lat Pull Down", Category: "Back" },
            { ID: "EX-VT8", Name: "Seated Cable Row", Category: "Back" },
            { ID: "EX-VT9", Name: "Inclined Bicep Curl", Category: "Arms" },
            { ID: "EX-VT10", Name: "Leg Curl", Category: "Legs" },
            { ID: "EX-VT11", Name: "Face Pulls", Category: "Shoulders" },
            { ID: "EX-VT12", Name: "Weighted Sit-Up", Category: "Core" }
        ];

        const DEFAULT_TEMPLATES = [
            {
                Template_Name: "Workout A (Push, Quads & Core)",
                Exercise_Sequence: "Incline Bench Press, Cable Lateral Raises, Dips, Leg Extension Machine, Overhead Tricep Cable Pull, Leg Raise"
            },
            {
                Template_Name: "Workout B (Pull, Hamstrings & Core)",
                Exercise_Sequence: "Lat Pull Down, Seated Cable Row, Inclined Bicep Curl, Leg Curl, Face Pulls, Weighted Sit-Up"
            }
        ];

        function seedDefaults() {
            DEFAULT_EXERCISES.forEach(defEx => {
                if (!appData.exercises.some(e => e.Name.toLowerCase() === defEx.Name.toLowerCase())) {
                    appData.exercises.push(defEx);
                }
            });
            DEFAULT_TEMPLATES.forEach(defTpl => {
                if (!appData.templates.some(t => t.Template_Name.toLowerCase() === defTpl.Template_Name.toLowerCase())) {
                    appData.templates.push(defTpl);
                }
            });
        }

        // --- 1. StateManager (SWR & localStorage Cache) ---
        const StateManager = {
            loadCache() {
                try {
                    const saved = localStorage.getItem('fitness_appData_v1');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (parsed.exercises && Array.isArray(parsed.exercises)) appData.exercises = parsed.exercises;
                        if (parsed.logs && Array.isArray(parsed.logs)) appData.logs = parsed.logs;
                        if (parsed.templates && Array.isArray(parsed.templates)) appData.templates = parsed.templates;
                    }
                } catch (e) { console.warn("Failed to load local cache:", e); }
                seedDefaults();
            },
            saveCache() {
                try {
                    localStorage.setItem('fitness_appData_v1', JSON.stringify(appData));
                } catch (e) { console.warn("Failed to save local cache:", e); }
            }
        };

        // --- 2. Offline Outbox Queue & Optimistic Sync ---
        const Outbox = {
            isSyncing: false,
            getQueue() {
                try { return JSON.parse(localStorage.getItem('fitness_outbox_v1') || '[]'); }
                catch (e) { return []; }
            },
            saveQueue(q) {
                try { localStorage.setItem('fitness_outbox_v1', JSON.stringify(q)); }
                catch (e) {}
                this.updateSyncBadge();
            },
            enqueue(item) {
                const q = this.getQueue();
                q.push(item);
                this.saveQueue(q);
                this.sync();
            },
            updateSyncBadge() {
                const badge = document.getElementById('sync-badge');
                if (!badge) return;
                const q = this.getQueue();
                if (!navigator.onLine) {
                    badge.className = "text-xs font-bold text-rose-400 bg-rose-500/10 px-2.5 py-1 rounded-full border border-rose-500/30 flex items-center gap-1.5";
                    badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-500 inline-block"></span> Offline (${q.length})`;
                } else if (q.length > 0) {
                    badge.className = "text-xs font-bold text-amber-400 bg-amber-500/10 px-2.5 py-1 rounded-full border border-amber-500/30 flex items-center gap-1.5 shadow-[0_0_10px_rgba(245,158,11,0.15)]";
                    badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500 inline-block animate-spin"></span> Syncing (${q.length})`;
                } else {
                    badge.className = "text-xs font-bold text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/30 flex items-center gap-1.5 shadow-[0_0_10px_rgba(16,185,129,0.15)]";
                    badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span> Synced`;
                }
            },
            async sync() {
                if (!navigator.onLine || this.isSyncing) {
                    this.updateSyncBadge();
                    return;
                }
                const q = this.getQueue();
                if (q.length === 0) {
                    this.updateSyncBadge();
                    return;
                }
                
                this.isSyncing = true;
                try {
                    const batchItems = q.filter(item => item.action === "BATCH_APPEND").map(i => i.data);
                    const deleteItems = q.filter(item => item.action === "DELETE");
                    
                    if (batchItems.length > 0) {
                        const res = await apiCall('POST', { type: "Logs", action: "BATCH_APPEND", items: batchItems });
                        if (res.success) {
                            const syncedIds = new Set(batchItems.map(i => i.Client_ID));
                            const remaining = this.getQueue().filter(item => !syncedIds.has(item.id));
                            this.saveQueue(remaining);
                        }
                    }
                    
                    for (const del of deleteItems) {
                        const res = await apiCall('POST', { type: "Logs", action: "DELETE", Log_ID: del.Log_ID });
                        if (res.success) {
                            const remaining = this.getQueue().filter(item => item.id !== del.id);
                            this.saveQueue(remaining);
                        }
                    }
                } finally {
                    this.isSyncing = false;
                    this.updateSyncBadge();
                }
            }
        };

        window.addEventListener('online', () => Outbox.sync());
        window.addEventListener('offline', () => Outbox.updateSyncBadge());

        // --- 3. Benchmark Engine (PR + Last Session Stats) ---
        function getExerciseBenchmarks(exerciseId, currentDate) {
            const history = appData.logs.filter(l => 
                l.Exercise_ID === exerciseId && 
                l.Date < currentDate &&
                l.Weight !== "" && l.Reps !== ""
            );

            const allHistory = appData.logs.filter(l => 
                l.Exercise_ID === exerciseId && 
                l.Date <= currentDate &&
                l.Weight !== "" && l.Reps !== ""
            );

            if (history.length === 0 && allHistory.length === 0) {
                return { lastSession: null, pr: null };
            }

            history.sort((a, b) => b.Date.localeCompare(a.Date) || ((a.Set_Index || 0) - (b.Set_Index || 0)));

            let lastSessionObj = null;
            if (history.length > 0) {
                const lastSessionDate = history[0].Date;
                const lastSessionSets = history.filter(l => l.Date === lastSessionDate);
                const summaryText = lastSessionSets.map(s => `${s.Weight}×${s.Reps}`).join(', ');
                lastSessionObj = {
                    date: lastSessionDate,
                    summaryText: summaryText,
                    sets: lastSessionSets
                };
            }

            let bestSet = null;
            if (allHistory.length > 0) {
                bestSet = allHistory[0];
                for (const s of allHistory) {
                    const weight = parseFloat(s.Weight) || 0;
                    const bestWeight = parseFloat(bestSet.Weight) || 0;
                    const reps = parseInt(s.Reps, 10) || 0;
                    const bestReps = parseInt(bestSet.Reps, 10) || 0;

                    if (weight > bestWeight || (weight === bestWeight && reps > bestReps)) {
                        bestSet = s;
                    }
                }
            }

            return {
                lastSession: lastSessionObj,
                pr: bestSet ? {
                    weight: bestSet.Weight,
                    reps: bestSet.Reps,
                    date: bestSet.Date
                } : null
            };
        }

        // --- 3.5. Smart Accordion Helpers ---
        let drafts = {};

        function captureInputDrafts() {
            if (!activeWorkout.exercises) return;
            activeWorkout.exercises.forEach((exName, exIndex) => {
                const wEl = document.getElementById(`weight-${exIndex}`);
                const rEl = document.getElementById(`reps-${exIndex}`);
                if (wEl && rEl) {
                    drafts[exName] = { weight: wEl.value, reps: rEl.value };
                }
            });
        }

        function getTargetSetCount(exName, dateVal) {
            if (activeWorkout.targetSets && activeWorkout.targetSets[exName] !== undefined) {
                return activeWorkout.targetSets[exName];
            }
            const setsToday = appData.logs.filter(l => l.Date === dateVal && l.Exercise_ID === exName);
            const benchmarks = getExerciseBenchmarks(exName, dateVal);
            const lastSessionCount = (benchmarks.lastSession && benchmarks.lastSession.sets) ? benchmarks.lastSession.sets.length : 3;
            return Math.max(3, lastSessionCount, setsToday.length);
        }

        function addTargetSet(exName) {
            const dateInput = document.getElementById('log-date');
            const dateVal = dateInput ? (dateInput.value || getLocalDateString()) : getLocalDateString();
            const currentTarget = getTargetSetCount(exName, dateVal);
            if (!activeWorkout.targetSets) activeWorkout.targetSets = {};
            activeWorkout.targetSets[exName] = currentTarget + 1;
            renderActiveWorkout();
        }

        function removeTargetSet(exName) {
            const dateInput = document.getElementById('log-date');
            const dateVal = dateInput ? (dateInput.value || getLocalDateString()) : getLocalDateString();
            const currentTarget = getTargetSetCount(exName, dateVal);
            if (currentTarget > 1) {
                if (!activeWorkout.targetSets) activeWorkout.targetSets = {};
                activeWorkout.targetSets[exName] = currentTarget - 1;
                renderActiveWorkout();
            }
        }

        function logGhostSet(exName, exIndex, rowIdx) {
            const wEl = document.getElementById(`ghost-w-${exIndex}-${rowIdx}`);
            const rEl = document.getElementById(`ghost-r-${exIndex}-${rowIdx}`);
            const weightVal = wEl ? wEl.value : "";
            const repsVal = rEl ? rEl.value : "";
            if (!weightVal || !repsVal) {
                return alert("Please enter Weight and Reps for set " + (rowIdx + 1));
            }
            logSetForExerciseDirect(exName, weightVal, repsVal);
        }

        function logSetForExerciseDirect(exName, weight, reps) {
            const dateInput = document.getElementById('log-date');
            const dateVal = dateInput ? (dateInput.value || getLocalDateString()) : getLocalDateString();

            const existingSets = appData.logs.filter(l => l.Date === dateVal && l.Exercise_ID === exName);
            const setIdx = existingSets.length + 1;

            const newLog = {
                Log_ID: Date.now(),
                Workout_ID: activeWorkout.routineName || "W-Manual",
                Date: dateVal,
                Exercise_ID: exName,
                Set_Index: setIdx,
                Weight: weight,
                Reps: reps,
                Client_ID: 'C-' + Date.now() + '-' + Math.random().toString(36).substr(2, 6),
                Timestamp: new Date().toISOString()
            };

            appData.logs.push(newLog);
            StateManager.saveCache();

            delete drafts[exName];
            renderActiveWorkout();
            renderDashboard();

            Outbox.enqueue({
                id: newLog.Client_ID,
                action: "BATCH_APPEND",
                data: newLog
            });
        }

        function initDefaultAccordionState() {
            activeWorkout.expandedExercises.clear();
            if (!activeWorkout.exercises || activeWorkout.exercises.length === 0) return;

            const dateInput = document.getElementById('log-date');
            const dateVal = dateInput ? (dateInput.value || getLocalDateString()) : getLocalDateString();

            let foundUncompleted = false;
            for (const exName of activeWorkout.exercises) {
                const setsToday = appData.logs.filter(l => l.Date === dateVal && l.Exercise_ID === exName);
                const targetCount = getTargetSetCount(exName, dateVal);
                if (setsToday.length < targetCount) {
                    activeWorkout.expandedExercises.add(exName);
                    foundUncompleted = true;
                    break;
                }
            }

            if (!foundUncompleted) {
                const loggedToday = appData.logs.filter(l => l.Date === dateVal && activeWorkout.exercises.includes(l.Exercise_ID));
                if (loggedToday.length > 0) {
                    const lastLoggedEx = loggedToday[loggedToday.length - 1].Exercise_ID;
                    activeWorkout.expandedExercises.add(lastLoggedEx);
                } else {
                    activeWorkout.expandedExercises.add(activeWorkout.exercises[0]);
                }
            }
        }

        function toggleAccordion(exName, exIndex) {
            const bodyEl = document.getElementById(`accordion-body-${exIndex}`);
            const iconEl = document.getElementById(`accordion-icon-${exIndex}`);
            const headerEl = document.getElementById(`accordion-header-${exIndex}`);
            if (!bodyEl) {
                if (activeWorkout.expandedExercises.has(exName)) {
                    activeWorkout.expandedExercises.delete(exName);
                } else {
                    activeWorkout.expandedExercises.add(exName);
                }
                renderActiveWorkout();
                return;
            }
            if (activeWorkout.expandedExercises.has(exName)) {
                activeWorkout.expandedExercises.delete(exName);
                bodyEl.classList.add('hidden');
                if (iconEl) iconEl.classList.remove('rotate-180');
                if (headerEl) {
                    headerEl.setAttribute('aria-expanded', 'false');
                    headerEl.classList.remove('border-b', 'border-zinc-800/80');
                }
            } else {
                activeWorkout.expandedExercises.add(exName);
                bodyEl.classList.remove('hidden');
                if (iconEl) iconEl.classList.add('rotate-180');
                if (headerEl) {
                    headerEl.setAttribute('aria-expanded', 'true');
                    headerEl.classList.add('border-b', 'border-zinc-800/80');
                }
            }
        }

        function toggleCollapseCompleted() {
            captureInputDrafts();
            const dateInput = document.getElementById('log-date');
            const dateVal = dateInput ? (dateInput.value || getLocalDateString()) : getLocalDateString();
            
            activeWorkout.exercises.forEach(exName => {
                const setsToday = appData.logs.filter(l => l.Date === dateVal && l.Exercise_ID === exName);
                const targetCount = getTargetSetCount(exName, dateVal);
                if (setsToday.length >= targetCount) {
                    activeWorkout.expandedExercises.delete(exName);
                } else {
                    activeWorkout.expandedExercises.add(exName);

            renderActiveWorkout();

        function setAllAccordion(collapse) {
            captureInputDrafts();
            if (collapse) {
                activeWorkout.expandedExercises.clear();
            } else {
                activeWorkout.exercises.forEach(exName => activeWorkout.expandedExercises.add(exName));

        // --- 4. Smart Rotation Auto-Scheduler (Zero-Click Landing View) ---
        function autoSelectNextRoutine() {
            const dateInput = document.getElementById('log-date');
            const todayStr = dateInput ? (dateInput.value || getLocalDateString()) : getLocalDateString();
            activeWorkout.date = todayStr;

            const setsToday = appData.logs.filter(l => l.Date === todayStr);
            if (setsToday.length > 0) {
                const uniqueExercises = Array.from(new Set(setsToday.map(s => s.Exercise_ID).filter(Boolean)));
                const firstWorkoutId = setsToday[0].Workout_ID;
                if (firstWorkoutId && firstWorkoutId !== "W-Manual") {
                    activeWorkout.routineName = firstWorkoutId;
                    const tpl = appData.templates.find(t => t.Template_Name === firstWorkoutId);
                    if (tpl && tpl.Exercise_Sequence) {
                        const tplEx = tpl.Exercise_Sequence.split(',').map(s => s.trim()).filter(Boolean);
                        const combined = [...tplEx];
                        uniqueExercises.forEach(e => { if (!combined.includes(e)) combined.push(e); });
                        activeWorkout.exercises = combined;
                    } else {
                        activeWorkout.exercises = uniqueExercises;
                    }
                } else {
                    activeWorkout.routineName = "Free Workout";
                    activeWorkout.exercises = uniqueExercises;
                }
                updateRoutineLabel();
                initDefaultAccordionState();
                return;
            }

            const pastDates = Array.from(new Set(appData.logs.filter(l => l.Date < todayStr).map(l => l.Date))).sort((a,b) => b.localeCompare(a));
            if (pastDates.length > 0 && appData.templates.length > 0) {
                let lastValidRoutine = "";
                for (const pDate of pastDates) {
                    const setsOnDate = appData.logs.filter(l => l.Date === pDate && l.Workout_ID && l.Workout_ID !== "W-Manual");
                    if (setsOnDate.length > 0) {
                        lastValidRoutine = setsOnDate[0].Workout_ID;
                        break;
                    }
                }
                let nextIdx = 0;
                const idx = appData.templates.findIndex(t => t.Template_Name === lastValidRoutine);
                if (idx !== -1) {
                    nextIdx = (idx + 1) % appData.templates.length;
                }
                const nextTpl = appData.templates[nextIdx];
                if (nextTpl && nextTpl.Exercise_Sequence) {
                    activeWorkout.routineName = nextTpl.Template_Name;
                    activeWorkout.exercises = nextTpl.Exercise_Sequence.split(',').map(s => s.trim()).filter(Boolean);
                    updateRoutineLabel();
                    initDefaultAccordionState();
                    return;
                }
            }

            if (appData.templates.length > 0) {
                const firstTpl = appData.templates[0];
                activeWorkout.routineName = firstTpl.Template_Name;
                activeWorkout.exercises = firstTpl.Exercise_Sequence.split(',').map(s => s.trim()).filter(Boolean);
            } else {
                activeWorkout.routineName = "Free Workout";
                activeWorkout.exercises = [];
            }
            updateRoutineLabel();
            initDefaultAccordionState();
        }

        function updateRoutineLabel() {
            const label = document.getElementById('active-routine-label');
            if (label) label.textContent = activeWorkout.routineName || "Free Workout";
        }

        // --- 5. Modal Routine Switcher ---
        function openRoutineModal() {
            const modal = document.getElementById('routine-modal');
            const list = document.getElementById('routine-modal-list');
            if (!modal || !list) return;

            let html = `
                <button onclick="selectRoutineOption('Free Workout')" class="w-full text-left p-3.5 rounded-xl hover:bg-zinc-800 border border-zinc-800/80 flex items-center justify-between font-black text-white transition">

            appData.templates.forEach(tpl => {
                html += `

        function closeRoutineModal() {
            const modal = document.getElementById('routine-modal');
            if (modal) modal.classList.add('hidden');
        }

        function selectRoutineOption(name) {
            closeRoutineModal();
            activeWorkout.routineName = name;
            updateRoutineLabel();

            if (name === "Free Workout") {
                activeWorkout.exercises = [];
            } else {
                const tpl = appData.templates.find(t => t.Template_Name === name);
                if (tpl && tpl.Exercise_Sequence) {
                    const tplEx = tpl.Exercise_Sequence.split(',').map(s => s.trim()).filter(Boolean);
                    tplEx.forEach(e => {
                        if (!activeWorkout.exercises.includes(e)) activeWorkout.exercises.push(e);
                    });
                }
            }
            drafts = {};
            initDefaultAccordionState();
            renderActiveWorkout();
        }

        function showLoading() { const l = document.getElementById('loading'); if(l) l.classList.remove('hidden'); }
        function hideLoading() { const l = document.getElementById('loading'); if(l) l.classList.add('hidden'); }
        
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('active', 'text-cyan-400', 'font-extrabold');
                el.classList.add('text-zinc-500');
            });
            const navBtn = document.getElementById('nav-' + tabId);
            if (navBtn) {
                navBtn.classList.add('active', 'text-cyan-400', 'font-extrabold');
                navBtn.classList.remove('text-zinc-500');
            }
        }

        async function apiCall(method, payload = null, typeParam = "") {
            try {
                let url = method === 'GET' ? `${API_URL}?type=${typeParam}` : API_URL;
                let options = { method: method, redirect: "follow" };
                if (payload) {
                    options.headers = { "Content-Type": "text/plain;charset=utf-8" };
                    options.body = JSON.stringify(payload);
                }
                const response = await fetch(url, options);
                return await response.json();
            } catch (err) {
                console.warn("API network notice:", err.message);
                return { success: false, error: err.message };
            }
        }

        async function fetchData() {
            StateManager.loadCache();
            autoSelectNextRoutine();
            renderAll();
            Outbox.updateSyncBadge();

            showLoading();
            const [exRes, logRes, tplRes] = await Promise.all([
                apiCall('GET', null, 'Exercises'),
                apiCall('GET', null, 'Logs'),
                apiCall('GET', null, 'Templates')
            ]);
            hideLoading();

            if (exRes.success && Array.isArray(exRes.data)) appData.exercises = exRes.data;
            if (logRes.success && Array.isArray(logRes.data)) appData.logs = logRes.data;
            if (tplRes.success && Array.isArray(tplRes.data)) appData.templates = tplRes.data;
            
            seedDefaults();
            StateManager.saveCache();
            autoSelectNextRoutine();
            renderAll();
            Outbox.sync();
        }

        function getLocalDateString() {
            const d = new Date();
            const pad = n => n < 10 ? '0'+n : n;
            return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
        }

            const dateInput = document.getElementById('log-date');
            if (dateInput && !dateInput.value) {

                                        ${idx >= 3 && idx === targetCount - 1 ? `
                                        <button onclick="removeTargetSet('${escapedExName}')" class="w-8 h-8 flex items-center justify-center text-zinc-500 hover:text-rose-400 rounded-lg" title="Remove target set">
                                            <i class="fas fa-times text-xs"></i>
                                        </button>
                                        ` : ''}
                                    </div>
                                </td>
                            </tr>
                        `;
                    }
                }).join('');

                const tableHtml = `
                    <table class="w-full text-left mb-2.5">
                        <thead>
                            <tr class="border-b border-zinc-700/60 text-[10px] font-bold text-zinc-400 uppercase tracking-wider">
                                <th class="py-1.5 px-2">Set</th>
                                <th class="py-1.5 px-2">Previous</th>
                                <th class="py-1.5 px-2">Weight</th>
                                <th class="py-1.5 px-2">Reps</th>
                                <th class="py-1.5 px-2 text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${allRowsHtml}
                        </tbody>
                    </table>
                    <div class="flex items-center justify-between pt-1.5 px-1 border-t border-zinc-800/80">
                        <span class="text-xs text-zinc-400 font-medium">
                            Progress: <strong class="${setsToday.length >= targetCount ? 'text-emerald-400' : 'text-cyan-400'}">${setsToday.length} / ${targetCount}</strong> sets completed
                        </span>
                        <button onclick="addTargetSet('${escapedExName}')" class="text-xs font-bold text-zinc-300 hover:text-white bg-zinc-800/80 hover:bg-zinc-700/80 border border-zinc-700/60 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 shadow-2xs active:scale-95">
                            <i class="fas fa-plus text-[10px] text-cyan-400"></i>
                            <span>Add Set</span>
                        </button>
                    </div>
                `;

                return `
                    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden shadow-lg transition-all">
                        <!-- 44px Compact Header Bar -->
                        <div id="accordion-header-${exIndex}" onclick="toggleAccordion('${escapedExName}', ${exIndex})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault(); toggleAccordion('${escapedExName}', ${exIndex});}" role="button" tabindex="0" aria-expanded="${isExpanded ? 'true' : 'false'}" aria-controls="accordion-body-${exIndex}" class="min-h-[44px] py-2.5 px-3.5 bg-zinc-900/95 flex items-center justify-between cursor-pointer select-none ${isExpanded ? 'border-b border-zinc-800/80' : ''}">
                            <div class="flex items-center flex-wrap gap-1.5 min-w-0 mr-2">
                                <span class="text-xs font-mono text-cyan-400 font-bold">[${exIndex + 1}]</span>
                                <span class="font-extrabold text-white text-sm sm:text-base tracking-tight truncate mr-1">${exName}</span>
                                ${lastBadgeHtml}
                                ${prBadgeHtml}
                            </div>
                            <div class="flex items-center gap-2 shrink-0">
                                ${completionBadgeHtml}
                                <i id="accordion-icon-${exIndex}" class="fas fa-chevron-down text-xs text-zinc-400 transition-transform duration-200 ${isExpanded ? 'rotate-180' : ''}"></i>
                                <button onclick="event.stopPropagation(); removeExerciseFromActiveWorkout('${escapedExName}')" class="w-8 h-8 flex items-center justify-center text-zinc-400 hover:text-rose-400 rounded-full hover:bg-zinc-800/80 transition-colors ml-1 shrink-0" title="Remove exercise" aria-label="Remove ${exName}">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>
                        
                        <!-- High-Density OLED Exercise Body -->
                        <div id="accordion-body-${exIndex}" class="p-3.5 bg-zinc-900/60 ${isExpanded ? '' : 'hidden'}">
                            <!-- Recessed Set Well -->
                            <div class="bg-zinc-950/60 border border-zinc-800/80 rounded-xl p-2.5">
                                ${tableHtml}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = toolbarHtml + cardsHtml;
        }

        function renderDashboard() {
            const logsByDate = {};
            appData.logs.forEach(log => {
                if (!log.Date || !log.Exercise_ID) return;
                const d = log.Date;
                if(!logsByDate[d]) logsByDate[d] = { sets: 0, volume: 0, exercises: new Set() };
                logsByDate[d].sets += 1;
                logsByDate[d].volume += (Number(log.Weight)||0) * (Number(log.Reps)||0);
                logsByDate[d].exercises.add(log.Exercise_ID);
            });
            const sortedDates = Object.keys(logsByDate).sort((a,b) => b.localeCompare(a));
            const dashHtml = sortedDates.map(date => `
                <div class="bg-zinc-900/90 border border-zinc-800/80 rounded-2xl p-5 shadow-xl mb-4 text-white">
                    <div class="flex justify-between items-center border-b border-zinc-800 pb-3 mb-3">
                        <span class="font-bold text-white text-base flex items-center gap-2">
                            <i class="far fa-calendar-check text-cyan-400"></i> ${date}
                        </span>
                        <span class="text-xs bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 px-2.5 py-1 rounded-full font-bold uppercase tracking-wide shadow-[0_0_10px_rgba(6,182,212,0.15)]">
                            ${logsByDate[date].sets} Sets
                        </span>
                    </div>
                    <div class="mb-3">
                        <div class="text-[11px] font-bold uppercase tracking-wider text-zinc-400 mb-0.5">Total Volume</div>
                        <div class="text-xl font-extrabold font-mono tabular-nums text-white">
                            ${logsByDate[date].volume.toLocaleString()} <span class="text-sm font-sans font-medium text-zinc-400">lbs</span>
                        </div>
                    </div>
                    <div class="bg-zinc-950/60 rounded-xl p-3 border border-zinc-800/80">
                        <div class="text-[11px] text-zinc-400 font-bold uppercase tracking-wider mb-1.5">Trained Exercises</div>
                        <div class="flex flex-wrap gap-1.5">
                            ${Array.from(logsByDate[date].exercises).map(e => `<span class="bg-zinc-900 border border-zinc-700/80 text-zinc-200 text-xs px-2.5 py-1 rounded-lg font-medium shadow-xs">${e}</span>`).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
            const dl = document.getElementById('dashboard-list');
            if (dl) {
                dl.innerHTML = dashHtml || "<p class='text-sm text-zinc-400 italic'>No workout days logged yet. Go log a set!</p>";
            }
        }

        function renderExerciseLibrary() {
            const exListHtml = appData.exercises.map(ex => `
                <div class="p-3.5 bg-zinc-900 border border-zinc-800 rounded-xl shadow-xs flex justify-between items-center text-white">
                    <span class="font-bold text-white text-sm">${ex.Name}</span>
                    <span class="text-[10px] uppercase font-extrabold tracking-wider bg-zinc-950 text-cyan-400 border border-zinc-800 px-2.5 py-1 rounded-full">${ex.Category || 'Generic'}</span>
                </div>
            `).join('');
            const el = document.getElementById('exercise-list');
            if (el) {
                el.innerHTML = exListHtml || '<p class="text-sm text-zinc-400 italic">No exercises added to database yet.</p>';
            }
        }

        function renderPlansList() {
            const plansHtml = appData.templates.map(tpl => `
                <div class="p-4 bg-zinc-900 border border-zinc-800 rounded-2xl shadow-xl text-white">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-extrabold text-white text-base">${tpl.Template_Name}</span>
                        <button onclick="startWorkout('${tpl.Template_Name.replace(/'/g, "\\'")}')" class="bg-gradient-to-r from-violet-500 to-indigo-600 hover:from-violet-400 hover:to-indigo-500 text-white font-bold px-3.5 py-1.5 rounded-xl text-xs shadow-[0_0_15px_rgba(139,92,246,0.25)] transition-all active:scale-95">Start</button>
                    </div>
                    <p class="text-xs text-zinc-400 leading-relaxed">${tpl.Exercise_Sequence}</p>
                </div>
            `).join('');
            const pl = document.getElementById('plans-list');
            if (pl) {
                pl.innerHTML = plansHtml || '<p class="text-sm text-zinc-400 italic">No schedules created yet.</p>';
            }
        }

        // --- 8. Set Mutations & Optimistic CRUD ---
        function logSetForExercise(exName, exIndex) {
            const weightEl = document.getElementById(`weight-${exIndex}`);
            const repsEl = document.getElementById(`reps-${exIndex}`);
            const weight = weightEl ? weightEl.value : "";
            const reps = repsEl ? repsEl.value : "";
            const dateInput = document.getElementById("log-date");
            const dateVal = dateInput ? (dateInput.value || getLocalDateString()) : getLocalDateString();

            if (weight === '' || reps === '') {
                return alert("Please enter Weight and Reps for " + exName);
            }

            const existingSets = appData.logs.filter(l => l.Date === dateVal && l.Exercise_ID === exName);
            const setIdx = existingSets.length + 1;

            const newLog = {
                Log_ID: Date.now(),
                Workout_ID: activeWorkout.routineName || "W-Manual",
                Date: dateVal,
                Exercise_ID: exName,
                Set_Index: setIdx,
                Weight: weight,
                Reps: reps,
                Client_ID: 'C-' + Date.now() + '-' + Math.random().toString(36).substr(2, 6),
                Timestamp: new Date().toISOString()
            };

            appData.logs.push(newLog);
            StateManager.saveCache();

            if (repsEl) repsEl.value = "";
            if (weightEl) weightEl.value = "";
            delete drafts[exName];
            renderActiveWorkout();
            renderDashboard();

            Outbox.enqueue({
                id: newLog.Client_ID,
                action: "BATCH_APPEND",
                data: newLog
            });
        }

        function deleteLog(logId) {
            appData.logs = appData.logs.filter(l => String(l.Log_ID) !== String(logId));
            StateManager.saveCache();
            renderActiveWorkout();
            renderDashboard();

            Outbox.enqueue({
                id: 'DEL-' + Date.now(),
                action: "DELETE",
                Log_ID: logId
            });
        }

        function addExerciseToActiveWorkout() {
            const sel = document.getElementById('add-exercise-select');
            const exName = sel ? sel.value : "";
            if (!exName) return alert("Please choose an exercise to add.");
            if (!activeWorkout.exercises.includes(exName)) {
                activeWorkout.exercises.push(exName);
            }
            activeWorkout.expandedExercises.add(exName);
            renderActiveWorkout();
            sel.value = "";
        }

        function removeExerciseFromActiveWorkout(exName) {
            activeWorkout.exercises = activeWorkout.exercises.filter(e => e !== exName);
            activeWorkout.expandedExercises.delete(exName);
            delete drafts[exName];
            renderActiveWorkout();
        }

        function finishWorkout() {
            const dateInput = document.getElementById("log-date");
            const dateVal = dateInput ? (dateInput.value || getLocalDateString()) : getLocalDateString();
            const setsToday = appData.logs.filter(l => l.Date === dateVal);
            if (setsToday.length === 0) {
                return alert("No sets logged for today's workout yet!");
            }
            alert(`Workout Session Saved!\n\nYou logged ${setsToday.length} total sets on ${dateVal}.\nCheck your History in the Dashboard!`);
            switchTab('dashboard');
        }

        function startWorkout(planName) {
            selectRoutineOption(planName);
            switchTab('log');
        }

        async function addExercise() {
            const name = document.getElementById("new-ex-name").value;
            const cat = document.getElementById("new-ex-cat").value;
            if(!name) return alert("Please provide an exercise name.");

            showLoading();
            const payload = {
                type: "Exercises",
                data: { ID: 'EX-'+Date.now(), Name: name, Category: cat }
            };
            const res = await apiCall('POST', payload);
            hideLoading();
            
            if (!res.success) {
                return alert("Failed to add exercise: " + (res.error || "Unknown error"));
            }
            
            appData.exercises.push(payload.data);
            StateManager.saveCache();
            document.getElementById("new-ex-name").value = "";
            renderAll();
            alert(`Added ${name} to your library!`);
        }

        async function addPlan() {
            const name = document.getElementById("new-plan-name").value;
            const selOptions = document.getElementById("new-plan-exercises").selectedOptions;
            const exercises = Array.from(selOptions).map(opt => opt.value).join(", ");
            
            if(!name || exercises.length === 0) return alert("Provide a schedule name and select at least one exercise.");

            showLoading();
            const payload = {
                type: "Templates",
                data: { Template_Name: name, Exercise_Sequence: exercises }
            };
            const res = await apiCall('POST', payload);
            hideLoading();
            
            if (!res.success) {
                return alert("Failed to save schedule: " + (res.error || "Unknown error"));
            }
            
            appData.templates.push(payload.data);
            StateManager.saveCache();
            document.getElementById("new-plan-name").value = "";
            renderAll();
            alert(`Workout plan '${name}' saved!`);
        }

        // Init App On Load
        fetchData();
    </script>
</body>
</html>
